[package]
name = "trustpay"
version = "0.1.0"
description = "Escrow with disputes and on-chain vendor reputation for social-commerce payments on Solana"
edition = "2021"
license = "MIT"
repository = "https://github.com/onepolymath/trustpay-escrow"

[lib]
crate-type = ["cdylib", "lib"]
name = "trustpay"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.3", default-features = false, features = ["token", "token_2022", "associated_token"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
