version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Anchor majors change the IDL/account format; upgrade deliberately, not via a bot.
      - dependency-name: "anchor-*"
        update-types: ["version-update:semver-major"]
